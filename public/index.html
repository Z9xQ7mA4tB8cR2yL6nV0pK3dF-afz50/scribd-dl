<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribd Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:#0a0a0f;color:#e4e4e7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
        .c{width:100%;max-width:520px}
        .logo{text-align:center;margin-bottom:36px}
        .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:white;margin-bottom:14px;box-shadow:0 8px 32px rgba(139,92,246,0.3)}
        h1{font-size:22px;font-weight:700;color:#e4e4e7}
        .sub{color:#71717a;font-size:13px;margin-top:4px}
        .card{background:#18181b;border:1px solid #27272a;border-radius:14px;padding:24px}
        input{width:100%;padding:13px 16px;background:#09090b;border:1px solid #27272a;border-radius:10px;color:#e4e4e7;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
        input:focus{border-color:#8b5cf6}
        input::placeholder{color:#52525b}
        .btn{width:100%;padding:13px;margin-top:12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:10px;color:white;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,92,246,0.35)}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .btn .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:sp .7s linear infinite;display:none}
        .btn.loading .sp{display:block}.btn.loading .lb{display:none}
        @keyframes sp{to{transform:rotate(360deg)}}
        .prog{margin-top:20px;display:none}.prog.show{display:block}
        .bar-w{background:#27272a;border-radius:6px;height:6px;overflow:hidden}
        .bar{height:100%;background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:6px;width:0%;transition:width .3s}
        .p-txt{margin-top:8px;font-size:13px;color:#a1a1aa;text-align:center}
        .err{margin-top:16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:14px;display:none;font-size:13px;color:#f87171}
        .err.show{display:block}
        .ok{margin-top:16px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:18px;display:none;text-align:center}
        .ok.show{display:block}
        .ok .ck{font-size:28px;margin-bottom:6px}
        .ok .info{color:#4ade80;font-size:14px;font-weight:600}
        .ok .meta{color:#71717a;font-size:12px;margin-top:4px}
        .ok a{display:inline-block;margin-top:14px;padding:10px 28px;background:#22c55e;color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px}
        .ok a:hover{background:#16a34a}
        .ft{text-align:center;margin-top:28px;font-size:11px;color:#3f3f46}
    </style>
</head>
<body>
    <div class="c">
        <div class="logo">
            <div class="logo-icon">S</div>
            <h1>Scribd Downloader</h1>
            <p class="sub">Scribd URL দিন, PDF পান</p>
        </div>
        <div class="card">
            <input type="text" id="url" placeholder="https://www.scribd.com/..." autofocus>
            <button class="btn" id="btn" onclick="go()">
                <div class="sp"></div>
                <span class="lb">ডাউনলোড করুন</span>
            </button>
            <div class="prog" id="prog">
                <div class="bar-w"><div class="bar" id="bar"></div></div>
                <div class="p-txt" id="ptxt"></div>
            </div>
            <div class="err" id="err"></div>
            <div class="ok" id="ok">
                <div class="ck">&#10003;</div>
                <div class="info">PDF তৈরি সম্পন্ন!</div>
                <div class="meta" id="meta"></div>
                <a id="link" href="#" download>ডাউনলোড PDF</a>
            </div>
        </div>
        <p class="ft">ব্রাউজার বন্ধ করলেও process চলবে server-এ</p>
    </div>
    <script>
        const BASE=(location.pathname.replace(/\/+$/,'/')||'/');
        const urlEl=document.getElementById('url'),btn=document.getElementById('btn'),prog=document.getElementById('prog'),bar=document.getElementById('bar'),ptxt=document.getElementById('ptxt'),err=document.getElementById('err'),ok=document.getElementById('ok'),meta=document.getElementById('meta'),link=document.getElementById('link');
        urlEl.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
        function reset(){btn.classList.remove('loading');btn.disabled=false;prog.classList.remove('show');err.classList.remove('show');ok.classList.remove('show');bar.style.width='0%';ptxt.textContent=''}
        async function go(){
            const url=urlEl.value.trim();
            if(!url){err.textContent='URL দিন';err.classList.add('show');return}
            if(!url.includes('scribd.com')){err.textContent='Scribd URL দিন';err.classList.add('show');return}
            reset();btn.classList.add('loading');btn.disabled=true;prog.classList.add('show');ptxt.textContent='শুরু হচ্ছে...';
            try{
                const r=await fetch(BASE+'api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
                const d=await r.json();
                if(!d.jobId){err.textContent='ত্রুটি';err.classList.add('show');btn.classList.remove('loading');btn.disabled=false;return}
                pollStatus(d.jobId);
            }catch(e){err.textContent='সংযোগে সমস্যা: '+e.message;err.classList.add('show');btn.classList.remove('loading');btn.disabled=false}
        }
        async function pollStatus(jobId){
            try{
                const r=await fetch(BASE+'api/status/'+jobId);
                const j=await r.json();
                bar.style.width=j.progress+'%';
                ptxt.textContent=j.text;
                if(j.status==='done'){
                    btn.classList.remove('loading');btn.disabled=false;
                    meta.textContent=j.text;
                    link.href=BASE+'api/file/'+jobId;
                    ok.classList.add('show');prog.classList.remove('show');
                }else if(j.status==='error'){
                    err.textContent=j.text;err.classList.add('show');
                    btn.classList.remove('loading');btn.disabled=false;prog.classList.remove('show');
                }else{
                    setTimeout(()=>pollStatus(jobId),1500);
                }
            }catch(e){
                setTimeout(()=>pollStatus(jobId),3000);
            }
        }
    </script>
</body>
</html>
